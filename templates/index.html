<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 语音助理 - FastAPI 版</title>
    <style>
        /* --- 基础样式 --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%; max-width: 600px; height: 100vh;
            background: #fff; display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .header {
            background: #1c2c4b; color: white; padding: 16px;
            text-align: center; font-size: 1.1rem; font-weight: 600;
            flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; gap: 8px;
        }

        .connection-indicator {
            width: 8px; height: 8px; border-radius: 50%;
            background: #2ecc71; animation: blink 2s infinite;
        }

        .connection-indicator.disconnected {
            background: #e74c3c; animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .chat-container {
            flex: 1; padding: 20px; overflow-y: auto;
            background: #f0f2f5; display: flex; flex-direction: column; gap: 16px;
        }

        .message {
            max-width: 85%; padding: 12px 16px; border-radius: 16px;
            font-size: 15px; line-height: 1.5; position: relative;
            word-wrap: break-word; animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message {
            align-self: flex-start;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white; border-bottom-left-radius: 4px;
        }

        .user-message {
            align-self: flex-end;
            background: #1c2c4b; color: white; border-bottom-right-radius: 4px;
        }

        .timestamp {
            font-size: 10px; margin-top: 4px; opacity: 0.6;
            display: block; text-align: right;
        }

        .controls {
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            background: #fff; border-top: 1px solid #eee;
            display: flex; flex-direction: column; align-items: center;
        }

        .mic-button {
            width: 72px; height: 72px; border-radius: 50%; border: none;
            background: #ff5e57; color: white; font-size: 30px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(255, 94, 87, 0.3);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }

        .mic-button:active { transform: scale(0.92); opacity: 0.9; }
        .mic-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .mic-button.recording { background: #2ecc71; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .status-text { margin-top: 12px; font-size: 13px; color: #888; font-weight: 500; }
    </style>
</head>

<body>

<div class="container">
    <div class="header">
        <div class="connection-indicator disconnected" id="connectionIndicator"></div>
        AI 语音助理 (FastAPI)
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">
            您好!点击麦克风说话,我会为您翻译并回答。
            <span class="timestamp">AI · 助手</span>
        </div>
    </div>

    <div class="controls">
        <button class="mic-button" id="micBtn" disabled>🎤</button>
        <div class="status-text" id="status">正在连接服务器...</div>
    </div>
</div>

<audio id="audioPlayer" playsinline></audio>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let socket;
    let isProcessing = false;
    let currentBotMessage = null;
    let audioQueue = [];
    let isPlayingAudio = false;

    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    const chatContainer = document.getElementById('chatContainer');
    const audioPlayer = document.getElementById('audioPlayer');
    const connectionIndicator = document.getElementById('connectionIndicator');

    function initWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        // 确保端口和路径与后端一致
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            console.log('✅ WebSocket 已连接');
            status.textContent = '点击开始录音';
            connectionIndicator.classList.remove('disconnected');
            micBtn.disabled = false;
        };

        socket.onclose = () => {
            status.textContent = '连接断开，尝试重连...';
            connectionIndicator.classList.add('disconnected');
            micBtn.disabled = true;
            setTimeout(initWebSocket, 3000);
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'user_text') {
                addMessage('user', data.text);
                currentBotMessage = null;
            }
            if (data.type === 'bot_token') appendBotText(data.token);
            if (data.type === 'bot_audio') {
                console.log('🎵 收到音频片段');
                addAudioToQueue(data.audio);
            }
            if (data.type === 'status') status.textContent = data.message;
            if (data.type === 'finished') {
                isProcessing = false;
                currentBotMessage = null;
            }
        };
    }

    function addAudioToQueue(base64Audio) {
        if (!base64Audio) return;
        audioQueue.push(base64Audio);
        if (!isPlayingAudio) {
            playNextAudio();
        }
    }

    function playNextAudio() {
        if (audioQueue.length === 0) {
            isPlayingAudio = false;
            console.log('🏁 所有音频播放完毕');
            return;
        }

        isPlayingAudio = true;
        const base64 = audioQueue.shift();

        // 关键点：确保前缀正确。edge-tts 通常返回的是 mp3 格式
        const prefix = base64.startsWith('data:') ? '' : 'data:audio/mpeg;base64,';
        audioPlayer.src = prefix + base64;

        console.log('🔈 正在播放下一段音频...');

        // 使用 promise 捕获播放错误
        audioPlayer.play().catch(e => {
            console.error("🚫 播放失败，可能是浏览器拦截:", e);
            // 尝试静音播放以继续队列（虽然听不到，但保证逻辑不卡死）
            isPlayingAudio = false;
            playNextAudio();
        });
    }

    // 监听播放结束，继续下一段
    audioPlayer.onended = () => {
        isPlayingAudio = false;
        playNextAudio();
    };

    micBtn.onclick = async () => {
        if (isProcessing) return;

        // 【非常重要】在用户点击瞬间激活 Audio 对象
        audioPlayer.load();
        const silentPlay = audioPlayer.play();
        if (silentPlay !== undefined) {
            silentPlay.then(() => { audioPlayer.pause(); }).catch(e => {});
        }

        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.onstart = () => {
                micBtn.classList.add('recording');
                micBtn.textContent = '⏹️';
                status.textContent = "正在录音...";
            };

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);

            mediaRecorder.onstop = () => {
                micBtn.classList.remove('recording');
                micBtn.textContent = '🎤';
                isProcessing = true;
                status.textContent = "AI 处理中...";

                stream.getTracks().forEach(t => t.stop());
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                sendAudio(audioBlob);
            };

            mediaRecorder.start();
        } catch (err) {
            alert("请确保在 HTTPS 或 localhost 环境下使用并开启麦克风权限");
        }
    };

    function sendAudio(blob) {
        // 发送新请求前，清空旧的音频队列
        audioQueue = [];
        isPlayingAudio = false;
        audioPlayer.pause();

        const reader = new FileReader();
        reader.onloadend = () => {
            const base64 = reader.result.split(',')[1];
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ audio: base64 }));
            }
        };
        reader.readAsDataURL(blob);
    }

    // 初始化界面逻辑
    function addMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}-message`;
        msgDiv.textContent = text;
        chatContainer.appendChild(msgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function appendBotText(text) {
        if (!currentBotMessage) {
            currentBotMessage = document.createElement('div');
            currentBotMessage.className = 'message bot-message';
            chatContainer.appendChild(currentBotMessage);
        }
        currentBotMessage.textContent += text;
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    initWebSocket();
</script>

</body>
</html>
